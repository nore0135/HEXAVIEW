databases:
  - name: hexaview-db
    databaseName: hexaview
    user: hexaview
    plan: free

services:
  - type: web
    name: hexaview-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hexaview-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://nore0135.github.io,http://localhost:3000
      - key: AUTO_MIGRATE
        value: "true"
      - key: SKIP_TIMESCALE
        value: "true"
      - key: PORT
        value: "4000"
      - key: HOST
        value: "0.0.0.0"
